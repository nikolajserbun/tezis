name: Ping Tezis API

# Vercel Functions wake on demand, so this ping is only a cheap uptime check.
# Periodic jobs run via Vercel Cron (/api/v1/internal/maintenance).
# If the project name changes, update the URL below.
#
# GitHub may delay scheduled runs and disables schedules after long periods
# of repository inactivity. Any push re-enables them.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            https://tezis-studio.vercel.app/api/v1/health/live
