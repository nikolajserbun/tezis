name: Keep Render API awake

# Render's free web service sleeps after 15 minutes without traffic. A ping
# every 10 minutes keeps the Telegram webhook responsive. If you rename the
# Render service, update the URL below (and FRONTEND_URL / VITE_API_BASE).
#
# GitHub may delay scheduled runs, and disables schedules after long periods
# of repository inactivity. Any push re-enables them.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            https://tezis-studio-api.onrender.com/api/v1/health/live
